name: sweetaudio

# SweetAudio.driver (tools/sweetaudio, the AudioServerPlugIn from HackiOS):
# one C file against the iOS SDK, built on its own so that it does not wait
# for Mesa.

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/sweetaudio/**'
      - '.github/workflows/sweetaudio.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build SweetAudio.driver
        run: |
          XC=$(ls -d /Applications/Xcode_15.4*.app | head -1)
          cd tools/sweetaudio
          DEVELOPER_DIR=$XC/Contents/Developer xcrun -sdk iphoneos clang -arch arm64 \
            -miphoneos-version-min=16.0 -O2 -Wall -bundle -framework CoreFoundation \
            -o SweetAudio sweetaudio.c
          codesign -f -s - SweetAudio

      - uses: actions/upload-artifact@v4
        with:
          name: sweetaudio
          path: |
            tools/sweetaudio/SweetAudio
            tools/sweetaudio/Info.plist
